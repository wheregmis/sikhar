<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello GPUI - Sparsha</title>
    <!-- Dev-only utility classes for DomTailwindRenderer (no CDN; see docs/elements.md). -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #030712;
        color: #f9fafb;
        font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .flex-row { flex-direction: row; }
      .gap-1 { gap: 0.25rem; }
      .gap-2 { gap: 0.5rem; }
      .gap-3 { gap: 0.75rem; }
      .gap-4 { gap: 1rem; }
      .gap-6 { gap: 1.5rem; }
      .p-2 { padding: 0.5rem; }
      .p-4 { padding: 1rem; }
      .p-6 { padding: 1.5rem; }
      .px-4 { padding-left: 1rem; padding-right: 1rem; }
      .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
      .w-full { width: 100%; }
      .h-full { height: 100%; }
      .min-h-0 { min-height: 0; }
      .overflow-auto { overflow: auto; }
      .border { border-width: 1px; border-style: solid; }
      .rounded-md { border-radius: 0.375rem; }
      .rounded-lg { border-radius: 0.5rem; }
      .text-sm { font-size: 0.875rem; }
      .text-base { font-size: 1rem; }
      .text-lg { font-size: 1.125rem; }
      .text-xl { font-size: 1.25rem; }
      .text-2xl { font-size: 1.5rem; }
      .text-4xl { font-size: 2.25rem; }
      .font-medium { font-weight: 500; }
      .font-semibold { font-weight: 600; }
      .font-bold { font-weight: 700; }
      .text-left { text-align: left; }
      .text-center { text-align: center; }
      .text-right { text-align: right; }

      button {
        cursor: pointer;
        border: none;
        font: inherit;
        color: inherit;
        line-height: 1.25;
      }

      button:hover {
        filter: brightness(1.08);
      }

      button:active {
        filter: brightness(0.95);
      }

      #sparsha-loading-shell {
        position: fixed;
        inset: 0 auto auto 0;
        width: 100%;
        height: 3px;
        background: rgba(31, 41, 55, 0.55);
        overflow: hidden;
        transition: opacity 180ms ease, visibility 180ms ease;
        z-index: 9999;
      }

      #sparsha-loading-shell .bar {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #2563eb 0%, #60a5fa 45%, #2563eb 100%);
        animation: sparsha-progress 0.9s linear infinite;
      }

      @keyframes sparsha-progress {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(260%);
        }
      }

      #sparsha-loading-shell.is-hidden {
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <main id="sparsha-loading-shell" aria-label="Loading">
      <div class="bar" aria-hidden="true"></div>
    </main>
    <noscript>
      <main>
        <h1>Hello GPUI</h1>
        <p>This app needs JavaScript enabled to run.</p>
      </main>
    </noscript>
    <script>
      (() => {
        const shell = document.getElementById("sparsha-loading-shell");
        if (!shell) return;

        let hidden = false;
        const hideShell = () => {
          if (hidden) return;
          hidden = true;
          requestAnimationFrame(() => {
            shell.classList.add("is-hidden");
            shell.setAttribute("aria-hidden", "true");
          });
        };

        window.addEventListener("SparshaFirstPaint", hideShell, { once: true });

        setTimeout(hideShell, 12_000);
      })();
    </script>
  </body>
</html>
